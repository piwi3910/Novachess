name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

  perft:
    name: Full-depth perft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"

      # The deep node counts are the real correctness gate for move generation.
      # They are too slow for every local `go test` run but cheap enough to run
      # on every push here. This covers the classical positions, the Chess960
      # suite across all 960 arrangements, and the mirror-symmetry check.
      - name: Perft
        run: go test ./internal/chess/ -run 'TestPerft|TestChess960' -perft-full -timeout 60m

  cross-compile:
    name: Cross-compile for the cluster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"

      # The self-play workers run on arm64. Building for it here catches any
      # accidental amd64-only dependency at the point it is introduced rather
      # than at deploy time.
      - name: Build arm64
        run: GOOS=linux GOARCH=arm64 go build ./...

  image:
    name: Build and push image
    runs-on: ubuntu-latest
    # Push events only: forked pull requests cannot write packages, and the
    # test job already proves the code builds.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # VERSION is stamped into every batch the workers produce, so a dataset
      # can be traced back to the exact build that generated it.
      - name: Version stamp
        id: version
        run: echo "version=$(git describe --always --dirty)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/novachess:${{ steps.version.outputs.version }}

  frontend:
    name: Dashboard frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web/dashboard

      - name: Test
        run: npm test
        working-directory: web/dashboard

      # The build is the artifact the Go binary embeds; a frontend that
      # tests green but does not build would still break the image job.
      - name: Build
        run: npm run build
        working-directory: web/dashboard
