# The trainer and the gatekeeper run once per generation.
#
# They are suspended CronJobs rather than Deployments so that `kubectl create
# job --from=` can start one on demand with the spec already in the cluster. A
# completed run is a fact, not something to keep alive: restarting a finished
# training run would train the same network again.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: novachess-trainer
  namespace: novachess
spec:
  # Started by hand, or by whatever eventually automates the hand-off. Never on
  # a timer: training before a generation's data is complete would fit a
  # network to a fraction of it.
  schedule: "0 0 31 2 *"
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: trainer
              image: novachess:dev
              env:
                # Let the garbage collector fight for the last gigabytes
                # before the cgroup kill does: fifteen-million-sample runs
                # live near the ceiling.
                - name: GOMEMLIMIT
                  value: "22GiB"
              command:
                - /usr/local/bin/trainer
                - -out
                - /data/networks/gen0.nnue
                - -epochs
                - "15"
                - -batch
                - "1024"
                - -lr
                - "0.001"
                # Weight the game's outcome over the search's own score. At
                # 0.5 half the training signal is the evaluation that played
                # the games, so the network learns to imitate its teacher and
                # approaches it from below rather than passing it - which is
                # what generation zero's gates measured: -446, -196, -44 Elo
                # against the hand-crafted evaluation, closing but never
                # crossing. The outcome is noisier but it is the only signal
                # that can exceed the player that generated it.
                - -result-weight
                - "0.8"
                - -lr-drops
                - "8,12"
                - -init
                - /data/networks/gen0.nnue
              args: ["/data/gen0/"]
              volumeMounts:
                - name: data
                  mountPath: /data
              resources:
                requests:
                  cpu: "4"
                  memory: 4Gi
                limits:
                  # The trainer loads every sample into memory and tonight's
                  # datasets reached fifteen million positions. Sized against
                  # the 30Gi boards with self-play parked during training.
                  memory: 24Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: novachess-data
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: novachess-gatekeeper
  namespace: novachess
spec:
  schedule: "0 0 31 2 *"
  suspend: true
  jobTemplate:
    spec:
      # No retries. The exit status is the decision, and a rejection is a
      # correct outcome rather than a failure to retry — rerunning until it
      # passed would defeat the entire point of the gate.
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: gatekeeper
              image: novachess:dev
              command:
                - /usr/local/bin/gatekeeper
                - -candidate
                - /data/networks/gen0.nnue
                # No -incumbent: generation zero is matched against the
                # hand-crafted evaluation, which is what it has to beat to be
                # worth using at all.
                - -games
                - "2000"
                - -nodes
                - "20000"
                - -concurrency
                - "6"
              volumeMounts:
                - name: data
                  mountPath: /data
              resources:
                requests:
                  # Self-play is parked while a gate runs, so these six
                  # concurrent pairs (each still one thread per side) have the
                  # board close to themselves rather than sharing it - raised
                  # from 4 now that a gate no longer plays one game at a time.
                  cpu: "6"
                  memory: 1Gi
                limits:
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: novachess-data
